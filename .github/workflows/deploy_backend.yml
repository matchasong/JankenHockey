name: Backend Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/README.md"

env:
  AWS_REGION: "ap-northeast-1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Auto Deploy Backend
    runs-on: ubuntu-latest

    # 公開リポジトリの場合はスキップ
    if: ${{ github.repository != 'matchasong/JankenHockey' }}

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          cd infra
          ./package_lambda.sh
          ./deploy.sh
        env:
          STACK_NAME: janken-hockey
          LAMBDA_BUCKET: ${{ secrets.LAMBDA_BUCKET }}
          LAMBDA_ZIP_PREFIX: janken-hockey-lambda
          OPERATOR_MAIL_ADDRESS: ${{ secrets.OPERATOR_MAIL_ADDRESS }}
