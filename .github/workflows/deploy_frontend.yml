name: Frontend Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "!frontend/README.md"

env:
  NODE_VERSION: "24.12.0"
  AWS_REGION: "ap-northeast-1" # 東京リージョン
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} # CloudFrontのディストリビューションID

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 公開リポジトリの場合はスキップ
    if: ${{ github.repository != 'matchasong/JankenHockey' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup API endpoints
        run: |
          cd frontend/script
          ./setup-endpoint-js.sh ${{ env.STACK_NAME }}
        env:
          STACK_NAME: janken-hockey

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build application
        run: |
          cd frontend
          npm run build

      - name: Deploy to S3
        run: |
          cd frontend
          aws s3 sync dist/ s3://${{ secrets.WEB_BUCKET }} --delete

      - name: Invalidate CloudFront cache (optional)
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
